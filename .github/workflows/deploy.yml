name: deploy

# Build the WASM engine from the pinned raptor/raptor-common
# revisions (see build-wasm.sh), prove native/WASM parity, then
# deploy web/ to GitHub Pages (verify.thingino.com). The engine is
# never a committed blob: every deployed byte traces to public
# sources through this public build.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # Pinned sources + emsdk land in build-deps/; the cache key
      # follows build-wasm.sh, where the pins live.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build-deps
          key: build-deps-${{ hashFiles('build-wasm.sh') }}

      - name: build engine from pinned sources
        run: ./build-wasm.sh

      - name: parity gate (ffmpeg for the fixture clip)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends ffmpeg
          ./test/parity.sh

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
